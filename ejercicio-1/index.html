<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cálculo de salario</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="container">
      <section class="card">
        <h1>Cálculo de salario</h1>
        <p class="description">
          Ingresa la información del empleado para calcular su salario semanal.
        </p>

        <form id="salary-form">
          <div class="field">
            <label for="nombre">Nombre del empleado</label>
            <input
              type="text"
              id="nombre"
              placeholder="Ej. Juan Pérez"
              required
            />
          </div>

          <div class="field">
            <label for="horas">Horas trabajadas</label>
            <input
              type="number"
              id="horas"
              placeholder="Ej. 48"
              min="0"
              required
            />
          </div>

          <button type="submit">Calcular salario</button>
        </form>

        <div id="resultado" class="result hidden"></div>
      </section>
    </main>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
